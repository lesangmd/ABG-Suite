plugins {
    id 'com.android.application'
}

android {
    namespace 'com.medipharm.abgsuite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.medipharm.abgsuite'
        minSdk 31
        targetSdk 35
        versionCode 7
        versionName '1.2.3'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

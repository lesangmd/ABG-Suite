name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Collect signing tools
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/MEDIPHARM-ABG-v1.0.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          chmod +x out/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-abg-android-build
          path: out/
          if-no-files-found: error
          retention-days: 7

name: Build Android APK

on:
  push:
    branches: [ main, branding-v1.2.2-o2-co2, focused-home-v1.2.3, dictionary-home-v1.3.0, action-home-v1.4.0, android-v1.5.0-complete, android-v1.0.0-baseline, android-v1.0.1-corrective, android-v1.0.2-dock-hotfix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore offline SQLite payload
        run: |
          mkdir -p app/src/main/assets out
          base64 -d offline/abg_offline_v120.db.xz.b64 | xz -dc > app/src/main/assets/abg_offline.db
          echo "a4b6d2ba5f87ee90bdca9f0023145587bac42d6dfcb206ac83eaa5c4f8b18266  app/src/main/assets/abg_offline.db" | sha256sum -c -
          sha256sum app/src/main/assets/abg_offline.db | tee out/abg_offline.db.sha256
          cp app/src/main/assets/abg_offline.db out/abg_offline.db

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect existing production signer
        run: |
          if [ -f MEDIPHARM-ABG-v1.1.1.apk ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs MEDIPHARM-ABG-v1.1.1.apk
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and align release APK
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 \
            "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"

      - name: Collect signing tool
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-abg-android-build
          path: out/
          if-no-files-found: error
          retention-days: 7

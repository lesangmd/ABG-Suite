name: Build MEDIPHARM ABG Android v1.2.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PRODUCTION_CERT_SHA256: '47826c56a86d6253f2b7419630c0f19ddc334392eebeec1da543cd3de97686ac'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore v6.11.4 offline database from verified source ZIP
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets out
          archive='MEDIPHARM-ABG-Android-v1.2.2-WebApp-v6.11.4-v1.1.0-SIGNING-LOCK-SOURCE (1).zip'
          echo 'b995cbc5e09b1d03074045225b797ba859de03364fb66612e4640c142412e350  '"$archive" | sha256sum -c -
          unzip -p "$archive" offline/abg_offline_v122.db.xz.b64 | base64 -d | xz -dc > app/src/main/assets/abg_offline.db
          expected=$(unzip -p "$archive" offline/abg_offline_v122.db.sha256 | awk '{print $1}')
          echo "$expected  app/src/main/assets/abg_offline.db" | sha256sum -c -
          python3 -c "import sqlite3; d=sqlite3.connect('app/src/main/assets/abg_offline.db'); m=dict(d.execute('select key,value from app_meta')); assert m['web_source_version']=='6.11.4',m; assert d.execute('pragma integrity_check').fetchone()[0]=='ok'"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and align release APK
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 \
            "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"

      - name: Require canonical v1.1.0 signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || { echo 'BLOCKED: missing production signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Sign and verify APK for in-place update from v1.1.0
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass 'env:STORE_PASS' --key-pass 'env:KEY_PASS' --out out/MEDIPHARM-ABG-v1.2.2.apk out/MEDIPHARM-ABG-v1.2.2-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/MEDIPHARM-ABG-v1.2.2.apk | tee out/signing-verification.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' out/signing-verification.txt | head -n1 | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$PRODUCTION_CERT_SHA256" || { echo "BLOCKED: signer $actual does not match installed v1.1.0 certificate"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/MEDIPHARM-ABG-v1.2.2.apk | grep -q "package: name='com.medipharm.abgsuite' versionCode='6' versionName='1.2.2'"
          sha256sum out/MEDIPHARM-ABG-v1.2.2.apk > out/MEDIPHARM-ABG-v1.2.2.apk.sha256
          rm -f "$RUNNER_TEMP/release.jks" out/MEDIPHARM-ABG-v1.2.2-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MEDIPHARM-ABG-v1.2.2-SIGNED
          path: |
            out/MEDIPHARM-ABG-v1.2.2.apk
            out/MEDIPHARM-ABG-v1.2.2.apk.sha256
            out/signing-verification.txt
          if-no-files-found: error
          retention-days: 7

name: Build NAH LAB Android v1.0.10

on:
  push:
    branches: [ nah-lab-v1010-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean APK
        working-directory: nah-lab
        run: gradle :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out-nah
          cp nah-lab/app/build/outputs/apk/debug/app-debug.apk out-nah/NAH-LAB-SUITE-Android-v1.0.10-clean-test.apk
          sha256sum out-nah/NAH-LAB-SUITE-Android-v1.0.10-clean-test.apk | tee out-nah/NAH-LAB-SUITE-Android-v1.0.10-clean-test.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: nah-lab-android-v1.0.10-clean
          path: out-nah/
          if-no-files-found: error
          retention-days: 7

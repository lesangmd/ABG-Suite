name: Publish NAH LAB SUITE latest

on:
  push:
    branches: [ nah-lab-suite-public ]
    paths:
      - ".github/workflows/publish-nah-lab-suite.yml"
      - "NAH-LAB-SUITE/PUBLISH-MARKER.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nah-lab-suite-public
          fetch-depth: 0

      - name: Download accepted Android v1.1.3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-artifact
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11319438097/zip > /tmp/android-artifact.zip
          unzip -q /tmp/android-artifact.zip -d /tmp/android-artifact
          test -f /tmp/android-artifact/NAH-LAB-SUITE-Android-v1.1.3-Persistent-Offline-Vault-Updater-test.apk
          test -f /tmp/android-artifact/NAH-LAB-SUITE-Android-v1.1.3-Source.zip
          echo "3f1496d6517c7ca7f03faee1096ce2f01cd73e7835bc6f88e51021efda1a3618  /tmp/android-artifact/NAH-LAB-SUITE-Android-v1.1.3-Persistent-Offline-Vault-Updater-test.apk" | sha256sum -c -
          echo "c143e20d332cc36c4b2cebb5c5f4bf19798030ec6c2413bf708681bd57fc21ec  /tmp/android-artifact/NAH-LAB-SUITE-Android-v1.1.3-Source.zip" | sha256sum -c -

      - name: Download accepted Desktop v1.3.1 runtime
        run: |
          set -euo pipefail
          DESKTOP_URL="https://sachyhoc.com/wp-content/plugins/nah-iso15189-suite/updates/NAH-LAB-SUITE-Desktop-v1.3.1-x64.zip"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180             "$DESKTOP_URL" -o /tmp/NAH-LAB-SUITE-Desktop-v1.3.1-x64.zip
          echo "76402fc11df4615f82c59156499f7bb434a55ea97d78afc1b8a72dadf4b9ab3e  /tmp/NAH-LAB-SUITE-Desktop-v1.3.1-x64.zip" | sha256sum -c -

      - name: Publish stable latest files
        run: |
          set -euo pipefail
          mkdir -p NAH-LAB-SUITE/releases/android
          mkdir -p NAH-LAB-SUITE/releases/desktop
          mkdir -p NAH-LAB-SUITE/source/android
          mkdir -p NAH-LAB-SUITE/source/desktop

          cp /tmp/android-artifact/NAH-LAB-SUITE-Android-v1.1.3-Persistent-Offline-Vault-Updater-test.apk              NAH-LAB-SUITE/releases/android/NAH-LAB-SUITE-Android-latest.apk
          cp /tmp/android-artifact/NAH-LAB-SUITE-Android-v1.1.3-Source.zip              NAH-LAB-SUITE/source/android/NAH-LAB-SUITE-Android-latest-Source.zip
          cp /tmp/NAH-LAB-SUITE-Desktop-v1.3.1-x64.zip              NAH-LAB-SUITE/releases/desktop/NAH-LAB-SUITE-Desktop-latest-x64.zip
          cp NAH-LAB-SUITE/source/desktop/NAH-LAB-SUITE-Desktop-v1.3.1-Source.zip              NAH-LAB-SUITE/source/desktop/NAH-LAB-SUITE-Desktop-latest-Source.zip

          cat > NAH-LAB-SUITE/latest.json <<'JSON'
          {
            "schema": "nah-lab-suite-github-latest/v1",
            "updatedAt": "2026-10-05",
            "android": {
              "version": "1.1.3",
              "versionCode": 11003,
              "packageId": "vn.nah.iso15189suite",
              "downloadUrl": "https://raw.githubusercontent.com/lesangmd/ABG-Suite/nah-lab-suite-public/NAH-LAB-SUITE/releases/android/NAH-LAB-SUITE-Android-latest.apk",
              "sourceUrl": "https://raw.githubusercontent.com/lesangmd/ABG-Suite/nah-lab-suite-public/NAH-LAB-SUITE/source/android/NAH-LAB-SUITE-Android-latest-Source.zip",
              "sha256": "3f1496d6517c7ca7f03faee1096ce2f01cd73e7835bc6f88e51021efda1a3618",
              "sourceSha256": "c143e20d332cc36c4b2cebb5c5f4bf19798030ec6c2413bf708681bd57fc21ec",
              "signingStatus": "validation-test-signed"
            },
            "desktop": {
              "version": "1.3.1",
              "platform": "windows-x64",
              "downloadUrl": "https://raw.githubusercontent.com/lesangmd/ABG-Suite/nah-lab-suite-public/NAH-LAB-SUITE/releases/desktop/NAH-LAB-SUITE-Desktop-latest-x64.zip",
              "sourceUrl": "https://raw.githubusercontent.com/lesangmd/ABG-Suite/nah-lab-suite-public/NAH-LAB-SUITE/source/desktop/NAH-LAB-SUITE-Desktop-latest-Source.zip",
              "sha256": "76402fc11df4615f82c59156499f7bb434a55ea97d78afc1b8a72dadf4b9ab3e",
              "sourceSha256": "0c6bb397b8fb2d29da0bd872ce3b4b537e95ddf81966ac11d61a5c07ee1ba084"
            }
          }
          JSON

      - name: Commit public channel
        run: |
          set -euo pipefail
          git config user.name "THƯ VIỆN MEDIPHARM"
          git config user.email "43851951+lesangmd@users.noreply.github.com"
          git add NAH-LAB-SUITE
          if git diff --cached --quiet; then
            echo "No distribution changes"
            exit 0
          fi
          git commit -m "Publish NAH LAB SUITE Android v1.1.3 and Desktop v1.3.1"
          git push origin HEAD:nah-lab-suite-public

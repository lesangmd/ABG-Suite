name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EXPECTED_SIGNER_SHA256: 2beb71a576fd79dced9d475ce0e63f002707eb5912988ebeceac3533ca9b3f4a
      ABG_KEYSTORE_PASSWORD: ${{ secrets.ABG_ANDROID_KEYSTORE_PASSWORD }}
      ABG_KEY_ALIAS: ${{ secrets.ABG_ANDROID_KEY_ALIAS }}
      ABG_KEY_PASSWORD: ${{ secrets.ABG_ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Require production signing secrets
        env:
          ABG_KEYSTORE_B64: ${{ secrets.ABG_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ABG_KEYSTORE_B64" || { echo "::error::Missing ABG_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$ABG_KEYSTORE_PASSWORD" || { echo "::error::Missing ABG_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ABG_KEY_ALIAS" || { echo "::error::Missing ABG_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ABG_KEY_PASSWORD" || { echo "::error::Missing ABG_ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ABG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/abg-release.keystore"
          chmod 600 "$RUNNER_TEMP/abg-release.keystore"

      - name: Restore offline SQLite payload
        run: |
          mkdir -p app/src/main/assets out
          base64 -d offline/abg_offline_v120.db.xz.b64 | xz -dc > app/src/main/assets/abg_offline.db
          echo "a4b6d2ba5f87ee90bdca9f0023145587bac42d6dfcb206ac83eaa5c4f8b18266  app/src/main/assets/abg_offline.db" | sha256sum -c -
          sha256sum app/src/main/assets/abg_offline.db | tee out/abg_offline.db.sha256

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4             "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"

      - name: Sign with MEDIPHARM production key
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$RUNNER_TEMP/abg-release.keystore"             --ks-key-alias "$ABG_KEY_ALIAS"             --ks-pass env:ABG_KEYSTORE_PASSWORD             --key-pass env:ABG_KEY_PASSWORD             --out "out/MEDIPHARM-ABG-v${VERSION_NAME}-signed.apk"             "out/MEDIPHARM-ABG-v${VERSION_NAME}-aligned-unsigned.apk"

      - name: Verify update-compatible signer
        run: |
          set -euo pipefail
          APK="out/MEDIPHARM-ABG-v${VERSION_NAME}-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee out/signing-certificate.txt
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match the installed MEDIPHARM ABG release key."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          sha256sum "$APK" | tee "out/MEDIPHARM-ABG-v${VERSION_NAME}-signed.apk.sha256"
          cp "$APK" out/MEDIPHARM-ABG-latest-signed.apk
          sha256sum out/MEDIPHARM-ABG-latest-signed.apk | tee out/MEDIPHARM-ABG-latest-signed.apk.sha256
          printf 'versionName=%s\nversionCode=%s\nsignerSha256=%s\n'             "$VERSION_NAME" "$VERSION_CODE" "$ACTUAL" > out/release-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-abg-android-signed-v${{ env.VERSION_NAME }}
          path: |
            out/MEDIPHARM-ABG-v*-signed.apk
            out/MEDIPHARM-ABG-v*-signed.apk.sha256
            out/MEDIPHARM-ABG-latest-signed.apk
            out/MEDIPHARM-ABG-latest-signed.apk.sha256
            out/signing-certificate.txt
            out/release-info.txt
            out/abg_offline.db.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/abg-release.keystore"

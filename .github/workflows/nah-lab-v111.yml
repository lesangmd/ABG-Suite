name: Build NAH LAB Android v1.1.1

on:
  push:
    branches: [ nah-lab-v111-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct v1.1.0 clean source
        run: |
          mkdir -p /tmp/nah-v111
          cat nah-lab-v110/chunks/*.b64 > /tmp/nah-v111/source.b64
          base64 -d /tmp/nah-v111/source.b64 > /tmp/nah-v111/source.zip
          unzip -t /tmp/nah-v111/source.zip
          mkdir -p /tmp/nah-v111/src
          unzip -q /tmp/nah-v111/source.zip -d /tmp/nah-v111/src

      - name: Apply v1.1.1 session/logo corrective
        run: |
          python3 nah-lab-v111/patch_v111.py /tmp/nah-v111/src nah-lab-v111/logo
          grep -q "versionCode 11001" /tmp/nah-v111/src/app/build.gradle
          grep -q "versionName '1.1.1'" /tmp/nah-v111/src/app/build.gradle
          grep -q "NAHISOAndroid/1.1.1" /tmp/nah-v111/src/app/src/main/java/vn/nah/iso15189suite/MainActivity.java
          grep -q 'android-v1.1.1-web-v1.45' /tmp/nah-v111/src/app/src/main/java/vn/nah/iso15189suite/MainActivity.java
          echo "ea0f8a7dca706f5908e19b811e8af39f5c20021220ee17320b5d9816ebf2c487  /tmp/nah-v111/src/app/src/main/res/drawable-nodpi/nah_logo_original.png" | sha256sum -c -

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean APK
        working-directory: /tmp/nah-v111/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify and collect APK
        run: |
          mkdir -p out-nah-v111
          APK=/tmp/nah-v111/src/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" out-nah-v111/NAH-LAB-SUITE-Android-v1.1.1-Original-Logo-Session-Hotfix-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" | tee out-nah-v111/apksigner-verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > out-nah-v111/zipalign-verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > out-nah-v111/aapt-badging.txt
          unzip -p "$APK" res/drawable-nodpi-v4/nah_logo_original.png > /tmp/apk-logo.png || true
          if [ -s /tmp/apk-logo.png ]; then
            echo "ea0f8a7dca706f5908e19b811e8af39f5c20021220ee17320b5d9816ebf2c487  /tmp/apk-logo.png" | sha256sum -c -
          fi
          sha256sum out-nah-v111/NAH-LAB-SUITE-Android-v1.1.1-Original-Logo-Session-Hotfix-test.apk | tee out-nah-v111/NAH-LAB-SUITE-Android-v1.1.1-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nah-lab-android-v1.1.1-original-logo-session-hotfix
          path: out-nah-v111/
          if-no-files-found: error
          retention-days: 7

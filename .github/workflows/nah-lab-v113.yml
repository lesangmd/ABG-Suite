name: Build NAH LAB Android v1.1.3

on:
  push:
    branches: [ nah-lab-v113-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct parent source
        run: |
          mkdir -p /tmp/nah-v113
          cat nah-lab-v110/chunks/*.b64 > /tmp/nah-v113/source.b64
          base64 -d /tmp/nah-v113/source.b64 > /tmp/nah-v113/source.zip
          unzip -t /tmp/nah-v113/source.zip
          mkdir -p /tmp/nah-v113/src
          unzip -q /tmp/nah-v113/source.zip -d /tmp/nah-v113/src
          python3 nah-lab-v111/patch_v111.py /tmp/nah-v113/src nah-lab-v111/logo
          python3 nah-lab-v112/patch_v112.py /tmp/nah-v113/src
          python3 nah-lab-v113/patch_v113.py /tmp/nah-v113/src

      - name: Contract checks
        run: |
          grep -q "versionCode 11003" /tmp/nah-v113/src/app/build.gradle
          grep -q "versionName '1.1.3'" /tmp/nah-v113/src/app/build.gradle
          grep -q "NAHISOAndroid/1.1.3" /tmp/nah-v113/src/app/src/main/java/vn/nah/iso15189suite/MainActivity.java
          grep -q "revokeValidationKeepVault" /tmp/nah-v113/src/app/src/main/java/vn/nah/iso15189suite/OfflineStore.java
          grep -q "desktop/dataset/manifest" /tmp/nah-v113/src/app/src/main/java/vn/nah/iso15189suite/HydrationManager.java
          grep -q "app/update-manifest" /tmp/nah-v113/src/app/src/main/java/vn/nah/iso15189suite/UpdateManager.java
          grep -q "REQUEST_INSTALL_PACKAGES" /tmp/nah-v113/src/app/src/main/AndroidManifest.xml
          echo "ea0f8a7dca706f5908e19b811e8af39f5c20021220ee17320b5d9816ebf2c487  /tmp/nah-v113/src/app/src/main/res/drawable-nodpi/nah_logo_original.png" | sha256sum -c -

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean APK
        working-directory: /tmp/nah-v113/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify and collect
        run: |
          mkdir -p out-nah-v113
          APK=/tmp/nah-v113/src/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" out-nah-v113/NAH-LAB-SUITE-Android-v1.1.3-Persistent-Offline-Vault-Updater-test.apk
          (cd /tmp/nah-v113/src && zip -qr "$GITHUB_WORKSPACE/out-nah-v113/NAH-LAB-SUITE-Android-v1.1.3-Source.zip" .)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" | tee out-nah-v113/apksigner-verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > out-nah-v113/zipalign-verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > out-nah-v113/aapt-badging.txt
          sha256sum out-nah-v113/NAH-LAB-SUITE-Android-v1.1.3-Persistent-Offline-Vault-Updater-test.apk out-nah-v113/NAH-LAB-SUITE-Android-v1.1.3-Source.zip | tee out-nah-v113/NAH-LAB-SUITE-Android-v1.1.3-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nah-lab-android-v1.1.3-persistent-vault-updater
          path: out-nah-v113/
          if-no-files-found: error
          retention-days: 7
